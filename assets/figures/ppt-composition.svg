<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="ppt-title ppt-desc">
<title id="ppt-title">Two symmetric PPT channels in succession remove entanglement with a reference</title>
<desc id="ppt-desc">An input system A may be entangled with an untouched reference R. A passes through channels Phi one and Phi two, each PPT and covariant under diagonal unitaries. Their composition is entanglement breaking, so the joint output with R is separable for every input. Classical correlations can remain.</desc>
<defs><marker id="ppt-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#748891" stroke-width="1.4"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#20323d">
<text x="16" y="25" font-size="11" letter-spacing="1.5" fill="#285d7a">A RESULT FOR SYMMETRIC PPT CHANNELS</text>
<text x="240" y="63" text-anchor="middle" font-size="12" fill="#5d696e">reference R stays untouched</text>
<path d="M55 88H429" fill="none" stroke="#9caeb5" marker-end="url(#ppt-arrow)"/>
<g fill="none" stroke="#9caeb5" marker-end="url(#ppt-arrow)"><path d="M55 177H117"/><path d="M221 177H256"/><path d="M360 177H429"/></g>
<g fill="#f7f6f2" stroke="#849da9"><circle cx="39" cy="88" r="16"/><circle cx="39" cy="177" r="16"/><circle cx="445" cy="88" r="16"/><circle cx="445" cy="177" r="16"/></g>
<g text-anchor="middle" font-family="Georgia,serif" font-size="17"><text x="39" y="94">R</text><text x="39" y="183">A</text><text x="445" y="94">R</text><text x="445" y="183">B</text></g>
<path d="M34 106C14 120 64 143 34 159M43 106C63 120 13 143 43 159" stroke="#285d7a" stroke-width="2" fill="none"/>
<text x="74" y="134" font-size="12" fill="#285d7a">entangled</text><text x="74" y="150" font-size="12" fill="#285d7a">input</text>
<rect x="121" y="156" width="100" height="43" rx="3" fill="#e1eaee" stroke="#9eb9c5"/><text x="171" y="185" font-family="Georgia,serif" font-size="25" text-anchor="middle">Φ₁</text>
<rect x="260" y="156" width="100" height="43" rx="3" fill="#e1eaee" stroke="#9eb9c5"/><text x="310" y="185" font-family="Georgia,serif" font-size="25" text-anchor="middle">Φ₂</text>
<g font-size="11" text-anchor="middle" fill="#5d696e"><text x="171" y="222">PPT + diagonal symmetry</text><text x="310" y="222">PPT + diagonal symmetry</text></g>
<path d="M445 110V155" stroke="#7c9385" stroke-width="1.4" stroke-dasharray="3 4"/>
<text x="424" y="129" text-anchor="end" font-size="12" fill="#466454">separable</text><text x="424" y="146" text-anchor="end" font-size="12" fill="#466454">output</text>
<path d="M121 235V241H360V235" fill="none" stroke="#9caeb5"/>
<text x="240" y="267" text-anchor="middle" font-family="Georgia,serif" font-size="20">Φ₂ ∘ Φ₁ is entanglement breaking.</text>
</g></svg>
