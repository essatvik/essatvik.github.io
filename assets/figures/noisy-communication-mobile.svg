<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="noise-mobile-title noise-mobile-desc">
  <title id="noise-mobile-title">Encoding, repeated noise, and decoding</title>
  <desc id="noise-mobile-desc">A compact layout of the same schematic. At the top, an encoding map E moves logical data into the physical memory L(H). Three downward arrows marked Psi, separated by an ellipsis, indicate repeated noise. At the bottom, a decoding map D maps the distorted stored information back to the logical data space. This illustrates the question of how much information remains recoverable.</desc>
  <defs>
    <marker id="noise-mobile-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#748891" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="Arial,Helvetica,sans-serif" fill="#5d696e" font-size="14" text-anchor="middle">
    <text x="64" y="27">Logical data</text>
    <text x="261" y="27" fill="#285d7a">Physical memory</text>
    <text x="142" y="54">Encode</text>
    <text x="101" y="196">Repeated noise</text>
    <text x="142" y="285">Decode</text>
    <text x="64" y="392">Decoded data</text>
  </g>
  <g fill="#f7f6f2" stroke="#a4b5bd" stroke-width="1.4">
    <rect x="218" y="43" width="86" height="78" rx="2"/>
    <rect x="218" y="286" width="86" height="78" rx="2"/>
  </g>
  <g fill="#dbe8ef" stroke="#285d7a" stroke-width="1.6">
    <circle cx="64" cy="82" r="26"/>
    <circle cx="261" cy="82" r="26"/>
    <path d="M252 299 C235 292 231 317 238 336 C244 350 263 352 283 357 C283 342 271 305 252 299Z"/>
    <circle cx="64" cy="325" r="26"/>
  </g>
  <g stroke="#748891" stroke-width="1.5" fill="none" marker-end="url(#noise-mobile-arrow)">
    <path d="M94 82H228"/>
    <path d="M261 133V164"/>
    <path d="M261 180V211"/>
    <path d="M261 245V276"/>
    <path d="M228 325H96"/>
  </g>
  <g font-family="Georgia,'Times New Roman',serif" fill="#20323d" font-size="24" text-anchor="middle">
    <text x="143" y="113" font-style="italic">ℰ</text>
    <text x="143" y="315">𝒟</text>
    <text x="233" y="157">Ψ</text>
    <text x="233" y="204">Ψ</text>
    <text x="233" y="268">Ψ</text>
    <text x="261" y="234" font-size="23">⋮</text>
    <text x="261" y="392" font-size="22">ℒ(ℋ)</text>
  </g>
</svg>
