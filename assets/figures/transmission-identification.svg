<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="id-title id-desc">
<title id="id-title">Transmission reconstructs a message; identification tests one identity</title>
<desc id="id-desc">Two separate coding tasks. In transmission, message m is encoded, sent through n uses of a noisy channel, and decoded to an estimate of m. In identification, the receiver is separately given a query j and applies a binary test to decide whether m equals j. The encoder does not receive j.</desc>
<defs><marker id="id-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#748891" stroke-width="1.4"/></marker></defs>
<g font-family="Arial,Helvetica,sans-serif" fill="#20323d">
<text x="16" y="25" font-size="11" letter-spacing="1.5" fill="#285d7a">TRANSMISSION</text>
<text x="16" y="47" font-family="Georgia,serif" font-size="15">“What message was sent?”</text>
<g stroke="#becacd" fill="none" marker-end="url(#id-arrow)"><path d="M36 87H55"/><path d="M135 87H154"/><path d="M242 87H261"/><path d="M353 87H375"/></g>
<text x="23" y="93" font-family="Georgia,serif" font-style="italic" font-size="22" text-anchor="middle">m</text>
<rect x="59" y="65" width="76" height="44" rx="3" fill="#f7f6f2" stroke="#c7d1d3"/><text x="97" y="92" font-size="13" text-anchor="middle">Encode</text>
<rect x="158" y="65" width="84" height="44" rx="3" fill="#e1eaee" stroke="#9eb9c5"/><text x="200" y="94" font-family="Georgia,serif" font-size="22" text-anchor="middle">Φ<tspan baseline-shift="super" font-size="11">⊗n</tspan></text>
<rect x="265" y="65" width="88" height="44" rx="3" fill="#f7f6f2" stroke="#c7d1d3"/><text x="309" y="92" font-size="13" text-anchor="middle">Decode</text>
<text x="409" y="94" font-family="Georgia,serif" font-size="23" text-anchor="middle">m̂</text><text x="409" y="130" font-size="11" fill="#5d696e" text-anchor="middle">a message</text>
<text x="200" y="130" font-size="11" fill="#5d696e" text-anchor="middle">noisy channel</text>
<path d="M16 153H464" stroke="#d5dad8"/>
<text x="16" y="181" font-size="11" letter-spacing="1.5" fill="#285d7a">IDENTIFICATION</text>
<text x="16" y="203" font-family="Georgia,serif" font-size="15">“Was it this one?”</text>
<g stroke="#becacd" fill="none" marker-end="url(#id-arrow)"><path d="M36 248H55"/><path d="M135 248H154"/><path d="M242 248H261"/><path d="M353 248H367"/></g>
<text x="23" y="254" font-family="Georgia,serif" font-style="italic" font-size="22" text-anchor="middle">m</text>
<rect x="59" y="226" width="76" height="44" rx="3" fill="#f7f6f2" stroke="#c7d1d3"/><text x="97" y="253" font-size="13" text-anchor="middle">Encode</text>
<rect x="158" y="226" width="84" height="44" rx="3" fill="#e1eaee" stroke="#9eb9c5"/><text x="200" y="255" font-family="Georgia,serif" font-size="22" text-anchor="middle">Φ<tspan baseline-shift="super" font-size="11">⊗n</tspan></text>
<rect x="265" y="226" width="88" height="44" rx="3" fill="#e2e9e3" stroke="#a3b6aa"/><text x="309" y="253" font-size="13" text-anchor="middle">Test D<tspan baseline-shift="sub" font-size="10">j</tspan></text>
<text x="409" y="254" font-size="18" text-anchor="middle" fill="#285d7a">yes / no</text>
<text x="363" y="193" font-size="12" fill="#526b62">query j</text><path d="M355 189H309V222" fill="none" stroke="#6e8a7d" marker-end="url(#id-arrow)"/>
<text x="409" y="292" font-size="11" fill="#5d696e" text-anchor="middle">one decision</text><text x="200" y="292" font-size="11" fill="#5d696e" text-anchor="middle">noisy channel</text>
</g></svg>
